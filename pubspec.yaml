name: quizoo
description: "Quizoo — a quiz app that plays like a game."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management (CLAUDE.md §3)
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  # Routing (CLAUDE.md §4)
  go_router: ^16.2.4

  # Sizing (CLAUDE.md §6)
  flutter_screenutil: ^5.9.3

  # Immutable models / DTOs (CLAUDE.md §9)
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Motion tokens (pop/slide/count) without hand-rolling every AnimationController
  flutter_animate: ^4.5.2

  # gen-l10n / RTL
  intl: any
  supabase_flutter: ^2.17.2
  shared_preferences: ^2.5.5
  firebase_core: ^4.14.0
  firebase_crashlytics: ^5.3.0
  firebase_analytics: ^12.5.0
  firebase_messaging: ^16.6.0
  firebase_remote_config: ^6.6.0
  google_mobile_ads: ^9.1.0
  in_app_purchase: ^3.3.0

  # Countdown/TTS read-aloud (plan 007, §4)
  flutter_tts: ^4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  build_runner: ^2.7.1
  freezed: ^3.2.3
  json_serializable: ^6.11.1

  # Testing (CLAUDE.md §11)
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

  # Native splash generation from assets/splash — dev-time codegen only, not
  # a runtime dependency. (App icons are pre-rendered per-platform assets,
  # placed directly under android/, ios/, web/ — no codegen step for those.)
  flutter_native_splash: ^2.4.3

  # Deterministic control of the play surface's clock in Cubit tests, so a
  # 20-second question costs no wall-clock time. Test-only; it ships with
  # nothing.
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/branding/quizoo-mark-color.png
    - assets/branding/quizoo-mark-white.png

  fonts:
    # Display / headings / buttons / scores
    - family: Baloo2
      fonts:
        - asset: assets/fonts/Baloo2-500.ttf
          weight: 500
        - asset: assets/fonts/Baloo2-600.ttf
          weight: 600
        - asset: assets/fonts/Baloo2-700.ttf
          weight: 700
        - asset: assets/fonts/Baloo2-800.ttf
          weight: 800
    # Body / UI text
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-400.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-500.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-600.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-700.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-800.ttf
          weight: 800
    # Meta / mono labels
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-400.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-500.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-700.ttf
          weight: 700
    # Urdu question / UI text
    - family: NotoNastaliqUrdu
      fonts:
        - asset: assets/fonts/NotoNastaliqUrdu-400.ttf
          weight: 400
        - asset: assets/fonts/NotoNastaliqUrdu-700.ttf
          weight: 700

# Native (pre-Flutter-frame) splash — owl mark on the solid Grape brand
# color, matching SplashScreen's gradient wash so the handoff to the
# animated S-01 screen (lib/features/onboarding/.../splash_screen.dart) is
# seamless.
flutter_native_splash:
  color: "#7B4DFF"
  image: assets/splash/splash_icon.png
  android_12:
    color: "#7B4DFF"
    image: assets/splash/splash_icon.png
